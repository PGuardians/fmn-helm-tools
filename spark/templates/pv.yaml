apiVersion: v1
kind: PersistentVolume
metadata:
  name: code-pv
spec:
  capacity:
    storage: {{ .Values.pv.storage }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.pv.storageClass }}
  hostPath:
    path: {{ .Values.codeVolume.hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: role
              operator: In
              values:
                - {{ .Values.nodeSelector.role }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}

      containers:
        - name: spark-master
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: SPARK_MASTER_HOST
              value: "0.0.0.0"

            - name: SPARK_MASTER_PORT
              value: "7077"

            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"

            - name: SPARK_PUBLIC_DNS
              value: spark-master.{{ .Release.Namespace }}.svc.cluster.local

            - name: LOG_DIR
              value: /var/log/spark/

            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: AZURE_STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.azure.secretName }}
                  key: AZURE_STORAGE_KEY

          command: ["/bin/bash","-c"]

          args:
            - |
              mkdir -p /var/log/spark
              export SPARK_NO_DAEMONIZE=true

              nohup /opt/spark/sbin/start-master.sh &
              sleep 10

              cd /opt/spark/code/Service-EFS.FMPRoHub.DataWorkloads/

              pip install -r requirements.txt

              echo "Starting CDC Streaming Job"

              nohup /opt/spark/bin/spark-submit \
                --master local[*] \
                --deploy-mode client \
                --name debz2iceberg-cdc \
                --conf spark.executor.memory={{ .Values.spark.executorMemory }} \
                --conf spark.driver.memory={{ .Values.spark.driverMemory }} \
                --conf spark.sql.shuffle.partitions={{ .Values.spark.shufflePartitions }} \
                --conf spark.sql.streaming.schemaInference=true \
                --conf spark.sql.streaming.checkpointLocation={{ .Values.azure.checkpoint }} \
                --conf spark.sql.catalog.bronze=org.apache.iceberg.spark.SparkCatalog \
                --conf spark.sql.catalog.bronze.type=hadoop \
                --conf spark.sql.catalog.bronze.warehouse={{ .Values.azure.warehouse }} \
                --conf spark.hadoop.fs.azure.account.key.{{ .Values.azure.storageAccount }}.dfs.core.windows.net=$AZURE_STORAGE_KEY \
                /opt/spark/code/Service-EFS.FMPRoHub.DataWorkloads/app/main/cdc_streaming_app.py \
                > /var/log/spark/cdc_streaming_app.log 2>&1 &

              echo "Starting FileAPI Streaming Job"

              nohup /opt/spark/bin/spark-submit \
                --master local[*] \
                --deploy-mode client \
                --name debz2iceberg-fileapi \
                --conf spark.executor.memory={{ .Values.spark.executorMemory }} \
                --conf spark.driver.memory={{ .Values.spark.driverMemory }} \
                --conf spark.sql.shuffle.partitions={{ .Values.spark.shufflePartitions }} \
                --conf spark.sql.streaming.schemaInference=true \
                --conf spark.sql.streaming.checkpointLocation={{ .Values.azure.checkpoint }} \
                --conf spark.sql.catalog.bronze=org.apache.iceberg.spark.SparkCatalog \
                --conf spark.sql.catalog.bronze.type=hadoop \
                --conf spark.sql.catalog.bronze.warehouse={{ .Values.azure.warehouse }} \
                --conf spark.hadoop.fs.azure.account.key.{{ .Values.azure.storageAccount }}.dfs.core.windows.net=$AZURE_STORAGE_KEY \
                /opt/spark/code/Service-EFS.FMPRoHub.DataWorkloads/app/main/file_api_streaming_app.py \
                > /var/log/spark/file_api_streaming_app.log 2>&1 &

              tail -f /dev/null

          ports:
            - containerPort: 7077
            - containerPort: 8080

          volumeMounts:
            - name: code-storage
              mountPath: /opt/spark/code
            - name: app-log
              mountPath: /opt/spark/code/Service-EFS.FMPRoHub.DataWorkloads/app/config/logs

      volumes:
        - name: code-storage
          persistentVolumeClaim:
            claimName: code-pvc

        - name: app-log
          hostPath:
            path: {{ .Values.logs.hostPath }}
            type: DirectoryOrCreate

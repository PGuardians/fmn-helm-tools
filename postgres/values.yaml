replicaCount: 1

image:
  repository: postgres
  tag: "15"
  pullPolicy: IfNotPresent

postgres:
  user: airflow
  password: airflow
  db: airflow

service:
  port: 5432
  nodePort: 30432

persistence:
  storageClass: local-path
  size: 15Gi
  accessMode: ReadWriteOnce
  path: /mnt

nodeSelector:
  app: airflow

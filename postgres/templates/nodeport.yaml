apiVersion: v1
kind: Service
metadata:
  name: postgresnodeport
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}

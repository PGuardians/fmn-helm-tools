apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apicurio-pvc
  namespace: {{ .Release.Namespace }}
spec:
  volumeName: apicurio-pv
  storageClassName: {{ .Values.storage.storageClass }}

  accessModes:
  - ReadWriteMany

  resources:
    requests:
      storage: {{ .Values.storage.size }}
